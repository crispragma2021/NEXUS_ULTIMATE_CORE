[package]
name = "nexus_ebpf"
version = "0.1.0"
edition = "2021"
description = "Phase 42: NEXUS eBPF Kernel Integration — eyes and control inside the Linux kernel"

[[bin]]
name = "nexus_ebpf"
path = "src/main.rs"

[dependencies]
# eBPF userspace runtime (aya = loader + maps + programs)
aya = { version = "0.13", features = ["async_tokio"] }
aya-log = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }
bytes = "1"

# Logging & errors
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
libc = "0.2"

# Shared event types
nexus_ebpf-common = { path = "../nexus_ebpf-common", features = ["user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8.8"

# Persistence & Alerts
sqlx = { workspace = true }
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
