[package]
name = "cerebro-ui"
version = "1.0.0"
edition = "2021"
description = "🧬 Visualizador del Cerebro Digital Dinámico v1 — Hodgkin-Huxley + STDP"
default-run = "cerebro-ui"

[lib]
name = "cerebro_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cerebro-ui"
path = "src/main.rs"

[[bin]]
name = "dev-server"
path = "src/bin/dev-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cerebro-digital = { path = ".." }
rand = "0.8"
