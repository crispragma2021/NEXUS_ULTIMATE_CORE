[package]
name = "nexus-ghost-scraper"
version = "0.1.0"
edition = "2021"
description = "NEXUS Ghost Engine - Pure Rust Scraper (Chromiumoxide/CDP)"

[dependencies]
tokio = { version = "1.37.0", features = ["full"] }
chromiumoxide = "0.5.7"
serde_json = "1.0"
anyhow = "1.0.82"
futures = "0.3"
regex = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
