[package]
name = "nexus-ui"
version = "1.0.0"
edition = "2021"
default-run = "nexus-ui"

[[bin]]
name = "nexus-ui"
path = "src/main.rs"

[[bin]]
name = "godot-controller"
path = "src/godot_controller_cli.rs"

[lib]
name = "nexus_ui"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["rustls-tls"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.40", features = ["full"] }
dotenv = "0.15"
axum = { version = "0.7", features = ["multipart", "ws"] }
tower-http = { version = "0.5", features = ["cors"] }
nexus_ultimate_core = { path = "../core" }
cerebro-digital = { path = "../engine-puro" }
portable-pty = "0.8"
regex = "1.10"
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
sysinfo = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
async-trait = "0.1"
socket2 = "0.5"
aes-gcm = "0.10"
anyhow = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }
