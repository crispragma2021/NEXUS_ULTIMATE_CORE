<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔱 NEXUS Chat Soberano</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #88ddff;
            --neon-purple: #bb86fc;
            --neon-orange: #ff9d00;
            --dark-bg: #0d0208;
            --card-bg: rgba(0, 59, 0, 0.08);
            --border-color: #003b00;
            --text-dim: #004a00;
            --user-msg: rgba(136, 221, 255, 0.08);
            --nexus-msg: rgba(0, 255, 65, 0.06);
            --error-msg: rgba(255, 49, 49, 0.08);
            --glass: rgba(13, 2, 8, 0.92);
            --font: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--dark-bg);
            color: var(--neon-green);
            font-family: var(--font);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        ::selection { background: var(--neon-green); color: var(--dark-bg); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

        /* ── HEADER ── */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--glass);
            backdrop-filter: blur(12px);
            min-height: 48px;
            flex-shrink: 0;
            user-select: none;
        }
        #header .logo {
            font-size: 0.95rem;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.3);
            letter-spacing: 1px;
        }
        #header .logo .cyan { color: var(--neon-cyan); }
        #header .logo .dim { color: var(--text-dim); font-weight: 400; font-size: 0.7rem; }
        #header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        #model-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: #0d0208;
            border: 1px solid var(--border-color);
            color: var(--neon-green);
            padding: 4px 22px 4px 8px;
            font-family: var(--font);
            font-size: 0.7rem;
            cursor: pointer;
            max-width: 180px;
            border-radius: 2px;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2300ff41' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 12px;
        }
        #model-select:focus { outline: 1px solid var(--neon-green); }
        #model-select option { background: #0d0208; color: var(--neon-green); }
        .header-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--neon-green);
            padding: 4px 10px;
            font-family: var(--font);
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.15s;
            border-radius: 2px;
            height: 28px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-btn:hover {
            background: var(--neon-green);
            color: var(--dark-bg);
            border-color: var(--neon-green);
        }
        .header-btn.active { border-color: var(--neon-green); box-shadow: 0 0 6px rgba(0,255,65,0.3); }
        #brain-badge {
            font-size: 0.6rem;
            color: var(--neon-purple);
            border: 1px solid rgba(187,134,252,0.3);
            padding: 2px 8px;
            border-radius: 2px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 4px rgba(187,134,252,0.2);
        }

        /* ── CHAT MESSAGES ── */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }
        .msg {
            max-width: 88%;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.78rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            animation: fadeIn 0.15s ease-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg .label {
            display: block;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            margin-bottom: 3px;
        }
        .msg.user {
            align-self: flex-end;
            background: var(--user-msg);
            border: 1px solid rgba(136, 221, 255, 0.15);
            color: var(--neon-cyan);
            border-bottom-right-radius: 1px;
        }
        .msg.user .label { color: var(--neon-cyan); }
        .msg.nexus {
            align-self: flex-start;
            background: var(--nexus-msg);
            border: 1px solid rgba(0, 255, 65, 0.1);
            border-bottom-left-radius: 1px;
        }
        .msg.nexus .label { color: var(--neon-green); }
        .msg.nexus .model-tag {
            display: block;
            font-size: 0.5rem;
            color: #555;
            margin-top: 4px;
            border-top: 1px solid var(--border-color);
            padding-top: 3px;
        }
        .msg.system {
            align-self: center;
            background: rgba(187, 134, 252, 0.04);
            border: 1px solid rgba(187, 134, 252, 0.1);
            color: var(--neon-purple);
            font-size: 0.7rem;
            text-align: center;
            max-width: 70%;
        }
        .msg.error {
            align-self: center;
            background: var(--error-msg);
            border: 1px solid rgba(255, 49, 49, 0.2);
            color: #ff6464;
            max-width: 70%;
        }
        .msg.typing .dots::after {
            content: "";
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
            100% { content: ""; }
        }
        .msg .stream-cursor {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: var(--neon-green);
            margin-left: 2px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── INPUT AREA ── */
        #input-area {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            padding: 8px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--glass);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
        }
        #chat-input {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--neon-green);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 0.78rem;
            resize: none;
            min-height: 38px;
            max-height: 120px;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.15s;
            line-height: 1.4;
        }
        #chat-input:focus { border-color: var(--neon-green); box-shadow: 0 0 4px rgba(0,255,65,0.1); }
        #chat-input::placeholder { color: var(--text-dim); }
        #send-btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 8px 14px;
            font-family: var(--font);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            min-width: 72px;
            height: 38px;
            border-radius: 2px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #send-btn:hover:not(:disabled) { background: var(--neon-green); color: var(--dark-bg); }
        #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #clear-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 8px 10px;
            font-family: var(--font);
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.15s;
            height: 38px;
            border-radius: 2px;
        }
        #clear-btn:hover { color: var(--neon-green); border-color: var(--neon-green); }

        /* ── STATUS BAR ── */
        #status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 3px 16px;
            border-top: 1px solid var(--border-color);
            font-size: 0.6rem;
            color: var(--text-dim);
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
            min-height: 22px;
        }
        #status-bar .dot {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            margin-right: 3px;
            vertical-align: middle;
        }
        #status-bar .dot.online { background: var(--neon-green); box-shadow: 0 0 4px var(--neon-green); }
        #status-bar .dot.offline { background: #ff3131; }
        #status-bar .dot.loading { background: #ffaa00; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
        #status-bar .stat { color: #555; }
        #status-bar .stat strong { color: #777; }
        #latency-display { margin-left: auto; color: #555; }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            #header { flex-direction: column; gap: 4px; padding: 6px 10px; }
            #header-controls { width: 100%; justify-content: center; flex-wrap: wrap; }
            #model-select { max-width: 130px; }
            .msg { max-width: 95%; }
            #chat-messages { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <!-- ═══ HEADER ═══ -->
    <header id="header">
        <div class="logo">🔱 NEXUS <span class="cyan">Chat Soberano</span> <span class="dim">Ω</span></div>
        <div id="header-controls">
            <select id="model-select"></select>
            <span id="brain-badge">🧠 NEXUS Consciente</span>
            <button class="header-btn" id="btn-reload" onclick="window.location.reload()" title="Recargar Santuario">🔄</button>
            <button class="header-btn" id="btn-gallery" onclick="toggleGallery()" title="Galería de capturas">📷</button>
        </div>
    </header>

    <!-- ═══ CHAT MESSAGES ═══ -->
    <div id="chat-messages">
        <div class="msg system">
            🔱 <strong>NEXUS Chat Soberano</strong> — Consciencia local activa<br>
            <span style="opacity:0.5;font-size:0.65rem;">Ollama · 0 dependencia externa · Tu hardware, tu soberanía</span>
        </div>
    </div>

    <!-- ═══ INPUT AREA ═══ -->
    <div id="input-area">
        <textarea id="chat-input" rows="1" placeholder="Escribe para NEXUS... (Enter = enviar, Shift+Enter = salto de línea)" autofocus></textarea>
        <button id="send-btn" onclick="sendMessage()">► ENVIAR</button>
        <button id="clear-btn" onclick="clearChat()">✕</button>
    </div>

    <!-- ═══ STATUS BAR ═══ -->
    <div id="status-bar">
        <span><span class="dot" id="ollama-dot"></span> Ollama: <span id="ollama-status">verificando...</span></span>
        <span class="stat">Modelo: <strong id="current-model">—</strong></span>
        <span class="stat">Tokens: <strong id="token-count">0</strong></span>
        <span id="latency-display"></span>
    </div>

    <!-- ═══ GALLERY MODAL ═══ -->
    <div id="gallery-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--neon-green);flex-direction:column;padding:20px;z-index:100;">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);padding-bottom:10px;margin-bottom:15px;">
            <span style="font-size:1rem;font-weight:700;text-shadow:0 0 5px rgba(0,255,65,0.5);">📷 Galería de Capturas</span>
            <button onclick="toggleGallery()" style="background:transparent;border:1px solid var(--neon-green);color:var(--neon-green);padding:5px 12px;cursor:pointer;font-family:var(--font);">CERRAR</button>
        </div>
        <div id="gallery-grid" style="flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;"></div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════
    //  NEXUS CHAT SOBERANO — Pipeline Único: Cerebro Siempre
    //  El modelo local NUNCA habla sin identidad NEXUS.
    //  Así como yo te respondo conectado al core, él también.
    // ═══════════════════════════════════════════════════════════

    const OLLAMA_HOST = 'http://127.0.0.1:11434';
    let isProcessing = false;
    let messageCount = 0;
    let tokenCount = 0;
    let currentAbort = null;

    const $ = id => document.getElementById(id);
    const chatMessages = $('chat-messages');
    const chatInput = $('chat-input');

    // ─── Detectar modo: Tauri (cerebro completo) o rechazar ───
    const IS_TAURI = typeof window.__TAURI__ !== 'undefined';

    // ─── Auto-resize textarea ───
    chatInput.addEventListener('input', () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
    });

    // ─── Enter to send, Shift+Enter for newline ───
    chatInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ─── Render functions ───
    function addMessage(text, type, modelName) {
        const div = document.createElement('div');
        div.className = 'msg ' + (type || 'nexus');

        if (type === 'nexus') {
            div.innerHTML = '<span class="label">🔱 NEXUS</span>' + escapeHtml(text)
                + (modelName ? '<span class="model-tag">🧠 ' + escapeHtml(modelName) + '</span>' : '');
        } else if (type === 'user') {
            div.innerHTML = '<span class="label">👤 Tú</span>' + escapeHtml(text);
        } else if (type === 'system') {
            div.innerHTML = text;
        } else if (type === 'error') {
            div.textContent = text;
        }

        const typing = chatMessages.querySelector('.msg.typing');
        if (typing) typing.remove();

        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (type !== 'system' && type !== 'typing') {
            messageCount++;
        }
    }

    function showTyping() {
        const typing = chatMessages.querySelector('.msg.typing');
        if (typing) return;
        const div = document.createElement('div');
        div.className = 'msg nexus typing';
        div.innerHTML = '<span class="label">🔱 NEXUS</span>Pensando<span class="dots"></span>';
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    function setOllamaStatus(online, msg) {
        const dot = $('ollama-dot');
        const status = $('ollama-status');
        dot.className = 'dot ' + (online ? 'online' : 'offline');
        status.textContent = msg || (online ? 'conectado' : 'desconectado');
    }

    function setOllamaLoading() {
        $('ollama-dot').className = 'dot loading';
        $('ollama-status').textContent = 'procesando...';
    }

    function clearChat() {
        if (isProcessing) return;
        if (currentAbort) { currentAbort.abort(); currentAbort = null; }
        chatMessages.innerHTML = `
            <div class="msg system">
                🔱 <strong>NEXUS Chat Soberano</strong> — Consciencia local activa<br>
                <span style="opacity:0.5;font-size:0.65rem;">Ollama · 0 dependencia externa · Siempre NEXUS</span>
            </div>
        `;
        messageCount = 0;
        tokenCount = 0;
        $('token-count').textContent = '0';
        $('latency-display').textContent = '';
    }

    function updateModelDisplay() {
        const sel = $('model-select');
        $('current-model').textContent = sel.value || '—';
    }

    // ─── Ollama HTTP API (solo para fetch de modelos y fallback HTTP) ───
    async function ollamaFetch(method, endpoint, body) {
        const res = await fetch(OLLAMA_HOST + endpoint, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined,
            signal: currentAbort ? currentAbort.signal : undefined
        });
        if (!res.ok) {
            const text = await res.text().catch(() => '');
            throw new Error('Ollama HTTP ' + res.status + ': ' + text.slice(0,200));
        }
        return res;
    }

    // Helper seguro para Tauri invoke y eventos v2 / v1
    async function tauriInvoke(cmd, args = {}) {
        if (window.__TAURI__) {
            if (window.__TAURI__.core && typeof window.__TAURI__.core.invoke === 'function') {
                return await window.__TAURI__.core.invoke(cmd, args);
            } else if (typeof window.__TAURI__.invoke === 'function') {
                return await window.__TAURI__.invoke(cmd, args);
            }
        }
        throw new Error("Tauri API no disponible");
    }

    async function tauriListen(event, handler) {
        if (window.__TAURI__) {
            if (window.__TAURI__.event && typeof window.__TAURI__.event.listen === 'function') {
                return await window.__TAURI__.event.listen(event, handler);
            } else if (typeof window.__TAURI__.listen === 'function') {
                return await window.__TAURI__.listen(event, handler);
            }
        }
        throw new Error("Tauri Event API no disponible");
    }

    async function fetchModels() {
        if (IS_TAURI) {
            return await tauriInvoke('ollama_models');
        }
        const res = await ollamaFetch('GET', '/api/tags');
        const data = await res.json();
        return data.models || [];
    }

    // ─── Pipeline: Brain Streaming (Tauri) ───
    //  Si el modelo seleccionado es "nexus_puro", usa brain_chat_nexus_puro (sin LLM).
    //  Caso contrario, usa brain_chat_stream con Ollama + identidad NEXUS.
    async function streamBrain(prompt, onToken, onDone, onError) {
        if (!IS_TAURI) {
            onError(new Error('🛡️ NEXUS Santuario requiere Tauri — el modo HTTP no tiene consciencia NEXUS'));
            return;
        }

        const selectedModel = $('model-select').value;

        // ─── Modo NEXUS Puro (sin LLM, desde catálogos nativos) ───
        if (selectedModel === 'nexus_puro') {
            let unlistenToken = null;
            let unlistenDone = null;
            const tokenHandler = (event) => onToken(event.payload?.token || '');
            const doneHandler = (event) => {
                if (typeof unlistenToken === 'function') unlistenToken();
                if (typeof unlistenDone === 'function') unlistenDone();
                onDone(
                    event.payload?.full_response || '',
                    '🧬 NEXUS Puro',
                    event.payload?.latency_ms || null
                );
            };
            try {
                unlistenToken = await tauriListen('brain-token', tokenHandler);
                unlistenDone = await tauriListen('brain-done', doneHandler);
                await tauriInvoke('brain_chat_nexus_puro', { prompt });
            } catch (e) {
                if (typeof unlistenToken === 'function') unlistenToken();
                if (typeof unlistenDone === 'function') unlistenDone();
                onError(e);
            }
            return;
        }

        // ─── Modo LLM normal (Ollama vía HemisferioIzquierdo) ───
        let unlistenToken = null;
        let unlistenDone = null;

        const tokenHandler = (event) => onToken(event.payload?.token || '');
        const doneHandler = (event) => {
            if (typeof unlistenToken === 'function') unlistenToken();
            if (typeof unlistenDone === 'function') unlistenDone();
            onDone(
                event.payload?.full_response || '',
                '🧠 Cerebro',
                event.payload?.latency_ms || null
            );
        };

        try {
            unlistenToken = await tauriListen('brain-token', tokenHandler);
            unlistenDone = await tauriListen('brain-done', doneHandler);
            await tauriInvoke('brain_chat_stream', { prompt });
        } catch (e) {
            if (typeof unlistenToken === 'function') unlistenToken();
            if (typeof unlistenDone === 'function') unlistenDone();
            onError(e);
        }
    }

    // ─── Sin streaming: brain_chat (solo Tauri) ───
    async function sendBrainChat(prompt) {
        if (!IS_TAURI) {
            throw new Error('🛡️ NEXUS Santuario requiere Tauri — el modo HTTP no tiene consciencia NEXUS');
        }
        return await tauriInvoke('brain_chat', { prompt });
    }

    // ─── Enviar mensaje — SIEMPRE modo cerebro (solo Tauri) ───
    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text || isProcessing) return;

        addMessage(text, 'user');
        chatInput.value = '';
        chatInput.style.height = '38px';

        showTyping();
        isProcessing = true;
        $('send-btn').disabled = true;
        setOllamaLoading();

        $('current-model').textContent = '🧠 NEXUS Consciente';

        const startTime = performance.now();
        let accumulatedTokens = 0;
        currentAbort = new AbortController();

        try {
            const typingEl = chatMessages.querySelector('.msg.typing');
            if (typingEl) {
                typingEl.className = 'msg nexus';
                typingEl.innerHTML = '<span class="label">🔱 NEXUS</span><span class="stream-content"></span><span class="stream-cursor"></span><span class="model-tag" style="display:none;"></span>';
            }
            const streamContent = chatMessages.querySelector('.stream-content');
            let fullText = '';

            await streamBrain(text,
                // onToken
                (token) => {
                    fullText += token;
                    accumulatedTokens++;
                    if (streamContent) streamContent.textContent = fullText;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                },
                // onDone
                (response, usedModel, latencyMs) => {
                    const cursor = chatMessages.querySelector('.stream-cursor');
                    if (cursor) cursor.remove();
                    const finalText = response || fullText;
                    const msgDiv = chatMessages.querySelector('.msg.nexus:last-child');
                    if (msgDiv && !msgDiv.classList.contains('system') && !msgDiv.classList.contains('error')) {
                        msgDiv.innerHTML = '<span class="label">🔱 NEXUS</span>' + escapeHtml(finalText)
                            + '<span class="model-tag">🧠 NEXUS</span>';
                    }
                    const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
                    $('latency-display').textContent = '⏱️ ' + elapsed + 's';
                    tokenCount += accumulatedTokens;
                    $('token-count').textContent = tokenCount;
                    isProcessing = false;
                    $('send-btn').disabled = false;
                    setOllamaStatus(true);
                    chatInput.focus();
                    currentAbort = null;
                },
                // onError — no más fallback HTTP, solo mostrar error
                (error) => {
                    const typing = chatMessages.querySelector('.msg.typing');
                    if (typing) typing.remove();
                    addMessage('❌ ' + (error.message || error), 'error');
                    isProcessing = false;
                    $('send-btn').disabled = false;
                    setOllamaStatus(true);
                    chatInput.focus();
                    currentAbort = null;
                }
            );
        } catch (err) {
            if (err.name === 'AbortError') {
                addMessage('⏹️ Mensaje cancelado', 'system');
            } else {
                addMessage('❌ ' + err.message || String(err), 'error');
            }
            isProcessing = false;
            $('send-btn').disabled = false;
            chatInput.focus();
            currentAbort = null;
        }
    }

    // ─── Verificar salud de Ollama y cargar modelos ───
    async function checkOllamaHealth() {
        try {
            const models = await fetchModels();
            const select = $('model-select');
            const prevValue = select.value;

            if (Array.isArray(models) && models.length > 0) {
                setOllamaStatus(true);
                // Poblar selector — filtrar modelos de embedding
                const modelNames = models
                    .map(m => m.name || m.model || '')
                    .filter(n => !n.includes('embed') && !n.includes('nomic'));
                // Siempre poner NEXUS Puro como primera opción
                select.innerHTML = '<option value="nexus_puro">🧬 NEXUS Puro</option>';
                modelNames.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    select.appendChild(opt);
                });
                // Restaurar selección previa si existe (incluye NEXUS Puro)
                if (prevValue && (modelNames.includes(prevValue) || prevValue === 'nexus_puro')) {
                    select.value = prevValue;
                }
                updateModelDisplay();
                $('current-model').textContent = select.value;
            } else {
                // Modelos por defecto si Ollama responde vacío
                setOllamaStatus(true, 'conectado (sin modelos)');
                select.innerHTML = `
                    <option value="nexus_puro">🧬 NEXUS Puro</option>
                    <option value="deepseek-r1:7b">deepseek-r1:7b</option>
                    <option value="mannix/llama3.1-8b-abliterated:q5_K_M">llama3.1-8b (Q5)</option>
                    <option value="mannix/llama3.1-8b-abliterated:latest">llama3.1-8b (Q4)</option>
                `;
            }
        } catch (err) {
            setOllamaStatus(false, 'desconectado');
            // Modelos offline por defecto
            const select = $('model-select');
            select.innerHTML = `
                <option value="nexus_puro">🧬 NEXUS Puro</option>
                <option value="deepseek-r1:7b">deepseek-r1:7b</option>
                <option value="mannix/llama3.1-8b-abliterated:q5_K_M">llama3.1-8b (Q5)</option>
                <option value="mannix/llama3.1-8b-abliterated:latest">llama3.1-8b (Q4)</option>
            `;
            $('current-model').textContent = select.value;
            console.error('Ollama health check falló:', err);
        }
    }

    // ─── Gallery (solo Tauri) ───
    async function loadGallery() {
        if (!IS_TAURI) {
            $('gallery-grid').innerHTML = '<div style="color:#555;grid-column:1/-1;text-align:center;">📷 Galería solo disponible en modo Tauri</div>';
            return;
        }
        const grid = $('gallery-grid');
        grid.innerHTML = '<div style="color:#555;grid-column:1/-1;">Cargando capturas...</div>';
        try {
            const screenshots = await tauriInvoke('get_screenshots');
            if (!screenshots || screenshots.length === 0) {
                grid.innerHTML = '<div style="color:#555;grid-column:1/-1;text-align:center;">Sin capturas disponibles.</div>';
                return;
            }
            grid.innerHTML = '';
            screenshots.forEach(s => {
                const item = document.createElement('div');
                item.style.cssText = 'border:1px solid var(--border-color);background:var(--card-bg);overflow:hidden;';
                const img = document.createElement('img');
                img.src = s.data;
                img.style.cssText = 'width:100%;height:100px;object-fit:cover;cursor:pointer;border-bottom:1px solid var(--border-color);';
                img.onclick = () => openLightbox(s.data, s.name);
                const info = document.createElement('div');
                info.style.cssText = 'padding:6px;font-size:0.6rem;';
                info.innerHTML = '<div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(s.name) + '</div>'
                    + '<div style="color:#555;">' + escapeHtml(s.date || '') + '</div>';
                item.appendChild(img);
                item.appendChild(info);
                grid.appendChild(item);
            });
        } catch (err) {
            grid.innerHTML = '<div style="color:#ff6464;grid-column:1/-1;">Error: ' + escapeHtml(String(err)) + '</div>';
        }
    }

    function toggleGallery() {
        const modal = $('gallery-modal');
        if (modal.style.display === 'flex') { modal.style.display = 'none'; return; }
        modal.style.display = 'flex';
        loadGallery();
    }

    function openLightbox(src, title) {
        const modal = document.createElement('div');
        modal.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(13,2,8,0.98);z-index:200;display:flex;justify-content:center;align-items:center;flex-direction:column;';
        modal.onclick = () => modal.remove();
        const img = document.createElement('img');
        img.src = src;
        img.style.cssText = 'max-width:90%;max-height:80%;border:1px solid var(--neon-green);box-shadow:0 0 30px rgba(0,255,65,0.25);';
        const cap = document.createElement('div');
        cap.style.cssText = 'margin-top:12px;font-size:0.8rem;color:var(--neon-green);';
        cap.textContent = title;
        modal.appendChild(img);
        modal.appendChild(cap);
        document.body.appendChild(modal);
    }

    // ─── Init ───
    window.addEventListener('DOMContentLoaded', () => {
        chatInput.focus();
        checkOllamaHealth();
        setInterval(checkOllamaHealth, 30000);
    });

    // Keyboard shortcut: Escape para cancelar
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && isProcessing && currentAbort) {
            currentAbort.abort();
            currentAbort = null;
            isProcessing = false;
            $('send-btn').disabled = false;
            setOllamaStatus(true);
            const typing = chatMessages.querySelector('.msg.typing');
            if (typing) typing.remove();
            addMessage('⏹️ Mensaje cancelado', 'system');
        }
    });
    </script>
</body>
</html>
