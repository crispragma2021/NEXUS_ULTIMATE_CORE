[workspace]
members = [
    "core",
    "nexus-ghost-shell",
    "nexus-shell",
    "src-tauri",
    "workshop/nexus-terminal",
    "scratch/nexus_headless",
    "mcp_arsenal/nexus_web_search"
]
exclude = [
    "nexus-puro-engine",
    "nexus_ebpf",
    "nexus_ebpf-ebpf",
    "nexus_ebpf-common",
    "tools/ctf_arsenal"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
anyhow = "1.0"
chrono = "0.4"
dotenv = "0.15"
uuid = { version = "1.8", features = ["v4"] }
regex = "1.10"
futures = "0.3"
rand = "0.8"
sysinfo = "0.31"
futures-util = "0.3"
once_cell = "1.19"
lazy_static = "1.4"
walkdir = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
ring = "0.17"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
ed25519-dalek = "2.1"
nix = { version = "0.29", features = ["process", "term", "fs"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
