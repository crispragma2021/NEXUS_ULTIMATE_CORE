name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXUS_TRANSPORT_DEBUG: "0"

# `shell: bash` en todos los pasos con lógica: en Windows el shell por defecto
# es pwsh y ahí no existen PIPESTATUS ni los heredocs.
defaults:
  run:
    shell: bash

jobs:
  agents-python:
    name: Agentes (Python) ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias de test
        run: python -m pip install --upgrade pip pytest

      - name: Ejecutar suite de agentes
        run: |
          python -m pytest tests/ -v 2>&1 | tee pytest.log
          estado=${PIPESTATUS[0]}
          {
            echo "### pytest — ${{ matrix.os }} / py${{ matrix.python-version }}"
            echo '```'
            tail -n 150 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$estado"

  daemon-rust:
    name: Daemon host (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de dependencias
        uses: swatinem/rust-cache@v2
        with:
          workspaces: daemon

      # Sin `cargo fmt --check`: el daemon ya no era fmt-clean antes de estos
      # cambios (imports sin reordenar) y bloquearía el pipeline por ruido.
      - name: Tests del daemon
        run: |
          cargo test --manifest-path daemon/Cargo.toml -- --test-threads=1 2>&1 | tee cargo.log
          estado=${PIPESTATUS[0]}
          {
            echo "### cargo test — daemon"
            echo '```'
            tail -n 120 cargo.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$estado"

  android-aarch64:
    name: Compilación Android aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Compilar daemon para Android
        run: |
          cargo build --release \
            --target aarch64-linux-android \
            --manifest-path daemon/Cargo.toml || {
            echo "::warning::El target Android necesita el NDK; se compila el host como respaldo"
            cargo build --release --manifest-path daemon/Cargo.toml
          }

  termux-simulado:
    name: Rutas bajo entorno Termux simulado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest

      # El check va en un archivo, no en un heredoc: dentro de `run: |` el cuerpo
      # queda indentado y Python lo rechaza con IndentationError.
      # El prefijo incluye `com.termux` a proposito para ejercitar la heuristica
      # real de deteccion, no solo el override NEXUS_PLATFORM.
      - name: Verificar resolución de rutas con $PREFIX de Termux
        run: |
          PREFIX="$RUNNER_TEMP/com.termux/files/usr"
          mkdir -p "$PREFIX/tmp"
          PREFIX="$PREFIX" TMPDIR="$PREFIX/tmp" python tools/check_termux_env.py

      - name: Ejecutar suite completa en el entorno simulado
        run: |
          PREFIX="$RUNNER_TEMP/com.termux/files/usr"
          mkdir -p "$PREFIX/tmp"
          PREFIX="$PREFIX" TMPDIR="$PREFIX/tmp" \
            python -m pytest tests/ -v 2>&1 | tee pytest.log
          estado=${PIPESTATUS[0]}
          {
            echo "### pytest — entorno Termux simulado"
            echo '```'
            tail -n 150 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$estado"
