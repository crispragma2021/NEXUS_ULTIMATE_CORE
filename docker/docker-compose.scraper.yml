# 🕸️ NEXUS Scraper Daemon — docker compose
#
# Levanta el daemon de scraping con SQLite persistente.
# Ollama se trata como servicio EXTERNO (en el host) para no duplicar la GPU:
#   - Docker Desktop: el daemon usa host.docker.internal → 127.0.0.1:11434
#   - Linux con Docker Engine: requiere --add-host=host.docker.internal:host-gateway
#
# Uso:
#   docker compose -f docker/docker-compose.scraper.yml up -d --build
#   docker compose -f docker/docker-compose.scraper.yml logs -f

services:
  scraper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scraper
    container_name: nexus-scraper
    restart: unless-stopped
    extra_hosts:
      # Permite que el contenedor alcance Ollama en el host (Linux).
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - RUST_LOG=info
    volumes:
      - scraper_data:/app/data
    command:
      - --db
      - /app/data/scraper.db
      - --poll-ms
      - "5000"
      - --ollama-model
      - qwen2.5:7b

volumes:
  scraper_data:
