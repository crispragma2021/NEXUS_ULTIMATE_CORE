version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════
# 🔱 NEXUS CUA — ENTORNO PRIMARIO: DOCKER HEADLESS GUI
# Computer-Using Agent — Navegación e Interacción Estándar
#
# Arquitectura: Xvfb (:99) + noVNC (puerto 6080)
#   - Display virtual 1920x1080, aislamiento de proceso del host.
#   - Consumo ultrabajo (~200-300 MB RAM), arranque 1-2s.
#   - Monitoreo/auditoría humana vía noVNC desde cualquier navegador.
#
# REGLA DE ORQUESTACIÓN:
#   - Usar DOCKER HEADLESS para interacción GUI diaria, navegador,
#     automatización de formularios y flujos rápidos con noVNC.
#   - MIGRAR A FIRECRACKER (entorno secundario) para binarios no
#     verificados, descargas sospechosas y pruebas que exijan KVM.
# ═══════════════════════════════════════════════════════════════════════════

services:
  cua-gui:
    build:
      context: .
      dockerfile: Dockerfile.cua
    image: nexus-cua-gui:latest
    container_name: nexus-cua-gui
    restart: unless-stopped
    init: true
    # network_mode host: comparte red del host para alcanzar Ollama local
    # (127.0.0.1:11434) y proxyMesh de NEXUS. Los puertos noVNC/VNC se exponen
    # directamente en el host (6080/5900).
    network_mode: host
    environment:
      - DISPLAY=:99
      - RESOLUTION=1920x1080x24
      - NOVNC_PORT=6080
      - VNC_PASSWORD=nexus
    shm_size: "512m"          # /dev/shm suficiente para Chromium
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:6080/vnc.html || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 256M

networks:
  default:
    name: nexus_cua_bridge
