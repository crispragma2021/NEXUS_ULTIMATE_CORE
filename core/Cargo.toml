[package]
name = "nexus_ultimate_core"
version = "0.1.0"
edition = "2021"

[features]
default = ["cli"]

# ==========================================
# 🧬 FEATURE FLAGS — Perfiles de compilación
# ==========================================
# cli:   Modo mínimo para terminal (nexus-shell)
# full:  Todas las capacidades (binarios completos)
# ==========================================

cli = []
full = ["cli"]

[[bin]]
name = "memoria_bridge"
path = "src/bin/memoria_bridge.rs"

[[bin]]
name = "nexus_harvester"
path = "src/bin/nexus_harvester.rs"

[[bin]]
name = "nexus_daemon"
path = "src/bin/nexus_daemon.rs"

[[bin]]
name = "nexus_test_native"
path = "src/bin/nexus_test_native.rs"

[[bin]]
name = "scraper-daemon"
path = "src/bin/scraper_daemon.rs"

[[bin]]
name = "antigravity-server"
path = "src/bin/antigravity_server.rs"

[[bin]]
name = "nexus_chat"
path = "src/bin/nexus_chat.rs"

[[bin]]
name = "smoke_test_encarnacion"
path = "src/bin/smoke_test_encarnacion.rs"

[dependencies]
tokio = { version = "1.40", features = ["full", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "socks"] }
anyhow = "1.0"
sysinfo = "0.31"
regex = "1.10"
walkdir = "2.5"
async-trait = "0.1"
futures = "0.3"
lazy_static = "1.4"
once_cell = "1.19"
uuid = { version = "1.8", features = ["v4", "serde"] }
hound = "3.5"
serde_yaml = "0.9"
cpal = "0.15"
pollster = "0.3"
chromiumoxide = "0.9"
enigo = "0.1.3"
rayon = "1.10"
# 🧬 Motor de inferencia nativo de vanguardia (mistral.rs) — sustituye a Candle para
# arquitecturas modernas (Qwen3, DeepSeek, Gemma, Mistral, Llama...). Rust puro, CPU nativa.
# v0.9.0 (git) — crates.io está congelado en 0.8.1 (anterior al soporte maduro de Qwen3),
# que falla con `failed to fill whole buffer` al cargar Qwen3. v0.9.0 corrige el loader GGUF.
# Sin features: compila CPU puro (no CUDA), ideal para el modo nativo soberano.
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", tag = "v0.9.0", package = "mistralrs" }
rand = "0.8"
bincode = "1.3"
libc = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
teloxide = { version = "0.12", features = ["macros"] }
image = "0.25"
nvml-wrapper = "0.10.0"
xcap = "0.9"
ring = "0.17"
base64 = "0.22"
crossbeam-channel = "0.5"
ed25519-dalek = "2.1"
tokio-tungstenite = "0.21"
nix = { version = "0.29", features = ["process", "sched"] }
sha2 = "0.10"
futures-core = "0.3"
tonic = "0.12"
prost = "0.13"
rodio = "0.19"
memmap2 = "0.9"
wgpu = "0.19"
bytemuck = "1.18"
winit = "0.30"
axum = "0.7"
notify = "6.1"
thiserror = "1.0"
aes-gcm = "0.10"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# 🕸️ Pipeline de scraping: HTML→Markdown determinista y enrutador de umbral
scraper = "0.25"
ego-tree = "0.10"
url = "2.5"

[dev-dependencies]
wiremock = "0.5"

[build-dependencies]
tonic-build = "0.12"

# 🪟 Windows: afinidad de hilos (SetThreadAffinityMask)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

# 🛡️ Kernel Shield (eBPF) — solo Linux (BPF no existe en Windows)
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
