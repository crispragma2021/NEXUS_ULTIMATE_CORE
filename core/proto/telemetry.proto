syntax = "proto3";

package nexus_telemetry;

service TelemetryOrchestrator {
  // Real-time synchronization stream
  rpc SyncHardware(stream HardwareState) returns (stream NexusCommand);
  
  // Mobile notification mirroring
  rpc PushNotification(Notification) returns (Ack);
}

message HardwareState {
  float cpu_usage = 1;
  float ram_usage = 2;
  float battery_level = 3;
  string status = 4;
}

message NexusCommand {
  string command_type = 1;
  string payload = 2;
}

message Notification {
  string app_name = 1;
  string title = 2;
  string body = 3;
  int64 timestamp = 4;
}

message Ack {
  bool success = 1;
}
